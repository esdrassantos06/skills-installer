appId: com.esdras.skills-installer
productName: Skills Installer
directories:
  output: dist
  buildResources: assets/icons
files:
  - out/**/*
  - package.json

# The bundled skills CLI (and its deps) must stay real files: Node's ESM
# loader cannot import from inside an asar archive, and the installer runs
# the CLI with Electron's own Node (ELECTRON_RUN_AS_NODE).
asarUnpack:
  - node_modules/**

# Release assets are uploaded by the workflow, not by electron-builder. Without
# this it self-publishes whenever GH_TOKEN is set, duplicating every asset and
# adding auto-update metadata (latest*.yml, blockmaps) the app never reads.
publish: null

electronLanguages: [en, en-US]

# macOS: unsigned distribution.
# identity: null disables code signing entirely. Users will need to remove the
# quarantine attribute after installing (see README "Install on macOS").
mac:
  target:
    - target: dmg
      arch: [arm64]
  category: public.app-category.developer-tools
  icon: assets/icons/icon.png
  identity: null

# Windows: unsigned. SmartScreen will show "Windows protected your PC" until
# the binary builds reputation (or someone buys a code-signing cert).
# Shipping portable + NSIS so users can pick.
win:
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
  icon: assets/icons/icon.png

linux:
  target:
    - target: AppImage
      arch: [x64]
  icon: assets/icons/icon.png
  category: Development

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: ${productName}-Setup-${version}.${ext}

portable:
  artifactName: ${productName}-Portable-${version}.${ext}

dmg:
  writeUpdateInfo: false
